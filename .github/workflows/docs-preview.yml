# Deploys the docs built for a PR (by docs.yml) to gh-pages/pr-preview/pr-N/, and
# removes them when the PR closes.  This runs in the base repo with a write token
# (so it works for PRs from forks), but it never checks out or runs PR code: it only
# copies the static site that docs.yml built.
#
# (`workflow_run` and `pull_request_target` workflows only run from the default
# branch, so this has no effect until it's on main.)
name: Docs preview
on:
  workflow_run:
    workflows: [Docs]
    types: [completed]
  pull_request_target:
    types: [closed]

# one at a time per PR branch (the PR number isn't known up here)
concurrency:
  group: >-
    docs-preview-${{ github.event.workflow_run.head_repository.full_name ||
    github.event.pull_request.head.repo.full_name }}-${{
    github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}

permissions:
  actions: read # to download the artifact from the docs.yml run
  contents: write
  pull-requests: write

jobs:
  deploy:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ runner.temp }}/artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: pr
        run: |
          number=$(cat "$RUNNER_TEMP/artifact/pr-number")
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "invalid PR number: $number"; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - id: preview
        uses: rossjrw/pr-preview-action@v1
        with:
          action: deploy
          source-dir: ${{ runner.temp }}/artifact/site
          pr-number: ${{ steps.pr.outputs.number }}
          comment: false # its own comment only works on pull_request events
      - uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: docs-preview
          number_force: ${{ steps.pr.outputs.number }}
          message: |
            Docs preview: ${{ steps.preview.outputs.preview-url }}
            <sub>Built from ${{ github.event.workflow_run.head_sha }}.</sub>

  remove:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # the base branch, not PR code
      - uses: rossjrw/pr-preview-action@v1
        with:
          action: remove
          pr-number: ${{ github.event.pull_request.number }}
          comment: false
